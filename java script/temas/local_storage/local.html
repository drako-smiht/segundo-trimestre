<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <title>Datos de usuario</title>
</head>
<body>
    <main class="p-3">
        <div class="container">
        <h2 class="h4 mb-3 text-primary text-center">Datos de usuario</h2>
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre:</label>
            <input class="form-control border-primary rounded-3 mt-1" type="text" id="nombre">
        </div>
        <div class="mb-3">
            <label class="form-label" for="apellido">Apellido:</label>
            <input class="form-control border-primary rounded-3 mt-1" type="text" id="apellido">
        </div>
        <div class="mb-3">
            <label class="form-label" for="numero">Número:</label>
            <input class="form-control border-primary rounded-3 mt-1" type="tel" id="numero">
        </div>
        <div class="mb-3">
            <label class="form-label" for="tipoDocumento">Tipo de documento:</label>
            <select class="form-select form-control border-primary rounded-3 mt-1 bg-light text-primary" id="tipoDocumento">
                <option class="bg-light text-primary" value="CC">Cédula de ciudadanía</option>
                <option class="bg-light text-primary" value="TI">Tarjeta de identidad</option>
                <option class="bg-light text-primary" value="Pasaporte">Pasaporte</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="numeroDocumento">Número de documento:</label>
            <input class="form-control border-primary rounded-3 mt-1" type="text" id="numeroDocumento">
        </div>
        <div class="mb-3">
            <label class="form-label" for="gmail">Gmail:</label>
            <input class="form-control border-primary rounded-3 mt-1" type="email" id="gmail">
        </div>
        <button class="btn-outline theme-primary" onclick="guardar()" type="button">Guardar</button>
        <button class="btn-outline theme-primary" onclick="ObtenerDatos()" type="button">Obtener datos</button>
    </div>
    </main>
    <main class="p-3">
        <div class="container">
        <h2 class="h4 mb-3 text-primary">Usuarios guardados</h2>
        <table class="table table-striped theme-primary table-bordered  table-card">
            <thead> 
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Apellido</th>
                    <th scope="col">Número</th>
                    <th scope="col">Tipo de documento</th>
                    <th scope="col">Número de documento</th>
                    <th scope="col">Gmail</th>
                </tr>
            </thead>
            <tbody id="tabla">
            </tbody>
            </table>
        </div>
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
    <script src="localstorage.js"></script>
    <script src="alertas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
