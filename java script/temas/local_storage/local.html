<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <title>Datos de usuario</title>
</head>
<body>
    <main class="p-3">
        <h1 class="h3">Datos de usuario</h1>
        <div class="mb-3">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" type="text" id="nombre">
        </div>
        <div class="mb-3">
            <label class="form-label" for="apellido">Apellido</label>
            <input class="form-control" type="text" id="apellido">
        </div>
        <button class="btn btn-primary" onclick="guardar()" type="button">Guardar</button>
        <button class="btn btn-secondary" onclick="ObtenerDatos()" type="button">Obtener datos</button>
    </main>
    <main class="p-3">
        <h2 class="h4">Usuarios guardados</h2>
        <table class="table">
            <thead>
                <tr>
                    <th scope="col">Nombre</th>
                    <th scope="col">Apellido</th>
                </tr>
            </thead>
            <tbody id="tabla">
            </tbody>
            </table>
    </main>
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
    <script src="localstorage.js"></script>

</body>
</html>
